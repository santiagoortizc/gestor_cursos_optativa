{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center px-4 py-10">

  <main class="w-full max-w-sm">

    <div class="bg-white border border-gray-200 rounded-lg p-6 sm:p-8 shadow-sm">

      <h1 class="text-2xl font-semibold text-gray-900 mb-1">Crear Cuenta</h1>
      <p class="text-sm text-gray-500 mb-6">Completa tus datos para registrarte</p>

      {% if errors %}
      <div class="mb-6 rounded-md bg-red-50 border border-red-200 p-3">
        <ul class="space-y-1">
          {% for error in errors %}
          <li class="text-sm text-red-600">{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <form method="post" action="{% url 'register' %}">
        {% csrf_token %}

        <div class="space-y-5">

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="first_name" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
                Nombre
              </label>
              <input type="text" id="first_name" name="first_name" required
                     value="{{ data.first_name }}"
                     class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
              <label for="last_name" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
                Apellido
              </label>
              <input type="text" id="last_name" name="last_name" required
                     value="{{ data.last_name }}"
                     class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
          </div>

          <div>
            <label for="username" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
              Nombre de usuario
            </label>
            <input type="text" id="username" name="username" required
                   value="{{ data.username }}"
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label for="email" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
              Correo electrónico
            </label>
            <input type="email" id="email" name="email" required
                   value="{{ data.email }}"
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label for="password1" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
              Contraseña
            </label>
            <input type="password" id="password1" name="password1" required
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label for="password2" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
              Confirmar contraseña
            </label>
            <input type="password" id="password2" name="password2" required
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

        </div>

        <button type="submit"
                class="mt-6 w-full inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors duration-150">
          Crear Cuenta
        </button>

      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:text-blue-700">
          Inicia sesión
        </a>
      </p>

    </div>

  </main>

</body>
</html>
