{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center px-4">

  <main class="w-full max-w-sm">

    <div class="bg-white border border-gray-200 rounded-lg p-6 sm:p-8 shadow-sm">

      <h1 class="text-2xl font-semibold text-gray-900 mb-1">Iniciar Sesión</h1>
      <p class="text-sm text-gray-500 mb-6">Ingresa tus credenciales para continuar</p>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="space-y-5">

          <div>
            <label for="username" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
              Nombre de usuario
            </label>
            <input type="text" id="username" name="username" required placeholder="Nombre de usuario" autofocus
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label for="password" class="block text-xs font-medium uppercase tracking-wide text-gray-400 mb-1">
              Contraseña
            </label>
            <input type="password" id="password" name="password" required placeholder="Contraseña"
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>

        </div>

        <button type="submit"
                class="mt-6 w-full inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors duration-150">
          Iniciar Sesión
        </button>

      </form>

    </div>

  </main>

</body>
</html>
